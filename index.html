
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>ClipMaker AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090909;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 padding:22px 6%;
 border-bottom:1px solid #292929;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:24px;
 font-weight:900;
 letter-spacing:-1px;
}

.logo span{color:#ff3030}

.tag{font-size:11px;color:#aaa}

main{
 max-width:900px;
 margin:45px auto;
 padding:0 18px;
}

h1{
 font-size:clamp(30px,6vw,48px);
 margin-bottom:8px;
}

h1 span{color:#ff3030}

.sub{
 color:#999;
 line-height:1.6;
}

.panel{
 background:#151515;
 border:1px solid #303030;
 border-radius:17px;
 padding:22px;
 margin-top:28px;
}

label{
 display:block;
 color:#ccc;
 font-size:13px;
 margin:18px 0 8px;
}

.upload{
 border:2px dashed #555;
 border-radius:13px;
 padding:35px 15px;
 text-align:center;
 cursor:pointer;
}

.upload strong{
 display:block;
 font-size:18px;
 margin-bottom:9px;
}

.upload p{
 color:#999;
 font-size:13px;
}

input[type=file]{display:none}

video{
 width:100%;
 max-height:350px;
 margin-top:15px;
 border-radius:12px;
 background:#000;
}

select{
 width:100%;
 padding:14px;
 background:#222;
 color:white;
 border:1px solid #444;
 border-radius:9px;
}

button{
 border:0;
 border-radius:10px;
 background:#ff3030;
 color:white;
 font-size:14px;
 font-weight:bold;
 cursor:pointer;
 padding:15px;
}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

#generate{
 width:100%;
 margin-top:24px;
}

.status{
 margin-top:18px;
 color:#bbb;
 text-align:center;
 font-size:14px;
 line-height:1.6;
}

.results{
 display:none;
 margin-top:30px;
}

.clip-card{
 background:#101010;
 border:1px solid #333;
 border-radius:14px;
 padding:15px;
 margin:18px 0;
}

.clip-card h3{
 margin:0 0 8px;
 font-size:16px;
}

.clip-card video{
 max-height:400px;
}

.download{
 display:block;
 width:100%;
 text-align:center;
 text-decoration:none;
 background:#242424;
 border:1px solid #ff3030;
 color:white;
 padding:15px;
 border-radius:10px;
 margin-top:13px;
 font-weight:bold;
 cursor:pointer;
}

.download:disabled{
 opacity:.5;
}

footer{
 text-align:center;
 color:#666;
 padding:30px 10px;
 font-size:12px;
}

</style>
</head>

<body>

<header>
 <div class="logo">CLIPMAKER<span> AI</span></div>
 <div class="tag">VIDEO EDITING ENGINE</div>
</header>

<main>

<h1>Convierte tus videos en <span>clips virales.</span></h1>

<p class="sub">
Sube un video y genera varios clips verticales listos para TikTok,
YouTube Shorts e Instagram Reels.
</p>

<section class="panel">

<label>SELECCIONA TU VIDEO</label>

<label class="upload" for="videoInput">
 <strong>＋ Sube tu video aquí</strong>
 <p>Selecciona un archivo MP4, MOV o compatible desde tu dispositivo.</p>
</label>

<input type="file" id="videoInput" accept="video/*">

<video id="preview" controls playsinline style="display:none"></video>

<label for="quantity">CANTIDAD DE CLIPS</label>
<select id="quantity">
 <option value="5">5 clips</option>
 <option value="10">10 clips</option>
 <option value="15">15 clips</option>
</select>

<label for="duration">DURACIÓN DE CADA CLIP</label>
<select id="duration">
 <option value="15">15 segundos</option>
 <option value="30">30 segundos</option>
 <option value="45">45 segundos</option>
 <option value="60">60 segundos</option>
</select>

<button id="generate" disabled>GENERAR MIS CLIPS</button>

<div class="status" id="status">
Selecciona un video para comenzar.
</div>

<div class="results" id="results">
 <h2>¡Tus clips están listos! 🔥</h2>
 <p class="sub" id="resultInfo"></p>
 <div id="clipsContainer"></div>
</div>

</section>
</main>

<footer>
CLIPMAKER AI © 2026 · Creado para creadores de contenido
</footer>

<script>
const ENGINE_URL = "https://clipmaker-engine.onrender.com";

const input = document.getElementById("videoInput");
const preview = document.getElementById("preview");
const generate = document.getElementById("generate");
const statusBox = document.getElementById("status");
const durationSelect = document.getElementById("duration");
const quantitySelect = document.getElementById("quantity");
const results = document.getElementById("results");
const clipsContainer = document.getElementById("clipsContainer");
const resultInfo = document.getElementById("resultInfo");

let selectedVideo = null;
let previewURL = null;

input.addEventListener("change", () => {
 const file = input.files[0];

 if (!file) return;

 if (previewURL) URL.revokeObjectURL(previewURL);

 selectedVideo = file;
 previewURL = URL.createObjectURL(file);

 preview.src = previewURL;
 preview.style.display = "block";

 results.style.display = "none";
 clipsContainer.innerHTML = "";

 statusBox.textContent = "Video seleccionado: " + file.name;
 generate.disabled = false;
});

generate.addEventListener("click", async () => {
 if (!selectedVideo) return;

 const duration = Number(durationSelect.value);
 const quantity = Number(quantitySelect.value);

 if (preview.duration && preview.duration < duration) {
  statusBox.textContent =
   "Tu video es más corto que la duración seleccionada.";
  return;
 }

 generate.disabled = true;
 results.style.display = "none";
 clipsContainer.innerHTML = "";

 statusBox.textContent =
  "Conectando con ClipMaker AI... El procesamiento puede tardar varios minutos.";

 const formData = new FormData();
 formData.append("video", selectedVideo);

 try {
  const response = await fetch(
   ENGINE_URL +
   "/process-multiple?quantity=" + quantity +
   "&duration=" + duration,
   {
    method:"POST",
    body:formData
   }
  );

  if (!response.ok) {
   const errorText = await response.text();
   throw new Error(
    "Error " + response.status + ": " + errorText
   );
  }

  const data = await response.json();

  if (!data.clips || data.clips.length === 0) {
   throw new Error("El motor no devolvió clips.");
  }

  resultInfo.textContent =
   "Se generaron " + data.clips.length +
   " clips de " + duration + " segundos cada uno.";

  data.clips.forEach((clip, index) => {
   const clipURL = clip.url.startsWith("http")
    ? clip.url
    : ENGINE_URL + clip.url;

   const card = document.createElement("div");
   card.className = "clip-card";

   const title = document.createElement("h3");
   title.textContent = "Clip " + (index + 1);

   const video = document.createElement("video");
   video.controls = true;
   video.playsInline = true;
   video.preload = "metadata";
   video.src = clipURL;

   const downloadButton = document.createElement("button");
   downloadButton.className = "download";
   downloadButton.textContent = "⬇ Descargar clip " + (index + 1);

   downloadButton.addEventListener("click", async () => {
    downloadButton.disabled = true;
    downloadButton.textContent = "Preparando descarga...";

    try {
     const fileResponse = await fetch(clipURL);

     if (!fileResponse.ok) {
      throw new Error("No se pudo obtener el archivo.");
     }

     const blob = await fileResponse.blob();
     const temporaryURL = URL.createObjectURL(blob);

     const link = document.createElement("a");
     link.href = temporaryURL;
     link.download = "clipmaker_clip_" + (index + 1) + ".mp4";

     document.body.appendChild(link);
     link.click();
     link.remove();

     setTimeout(() => URL.revokeObjectURL(temporaryURL), 60000);

     downloadButton.textContent = "✓ Descarga iniciada";
    } catch (error) {
     downloadButton.textContent = "Error al descargar";
     statusBox.textContent = error.message;
    } finally {
     downloadButton.disabled = false;
    }
   });

   card.appendChild(title);
   card.appendChild(video);
   card.appendChild(downloadButton);

   clipsContainer.appendChild(card);
  });

  results.style.display = "block";
  statusBox.textContent = "¡Procesamiento completado correctamente!";

  results.scrollIntoView({
   behavior:"smooth",
   block:"start"
  });

 } catch (error) {
  statusBox.textContent =
   "No se pudo procesar el video: " + error.message;
 } finally {
  generate.disabled = false;
 }
});
</script>

</body>
</html>
